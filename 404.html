<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable (404) | Enzo GIORDANI</title>

    <!-- Favicon SVG -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%232563eb'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' font-family='sans-serif' font-size='50' font-weight='bold' fill='white'>EG</text></svg>">

    <link rel="stylesheet" href="assets/css/style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Anti-FOUC Theme Script -->
    <script>
      (function () {
        const savedTheme = localStorage.getItem("portfolio-theme");
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = savedTheme || (prefersDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>

    <style>
        .container-404-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            background-color: var(--bg-main);
            background-image: var(--hero-mesh);
        }

        .card-404 {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 3rem 2.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--card-shadow);
            max-width: 580px;
            width: 100%;
        }

        .title-404 {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.25rem;
            line-height: 1;
        }

        .subtitle-404 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 1.5rem;
        }

        .gif-travolta {
            max-width: 100%;
            height: auto;
            border-radius: var(--radius-md);
            margin: 0 auto 1.5rem auto;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
        }

        .text-404 {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <main class="container-404-page">
        <div class="card-404">
            <h1 class="title-404">404</h1>
            <p class="subtitle-404">Oups ! Il semblerait que vous soyez perdu...</p>
            
            <img src="assets/img/travolta.gif" alt="John Travolta perdu" class="gif-travolta">
            
            <p class="text-404">Le lien que vous avez suivi est peut-être erroné, ou la page a été déplacée.</p>
            
            <a href="index.html" class="btn btn-primary">
                <span>← Retourner sur l'accueil</span>
            </a>
        </div>
    </main>

    <!-- Main JS for Theme Support -->
    <script src="assets/js/main.js"></script>
</body>
</html>
